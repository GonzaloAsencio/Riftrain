<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftrain — tests de navegador</title>
<link rel="stylesheet" href="../app.css">
<style>
  body { padding: 0; }
  /* pre-wrap: un mensaje largo no puede ensanchar la pagina y romper los checks de layout */
  #out { font-family: ui-monospace, monospace; font-size: 12px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .t-pass { color: #2f7d5a; }
  .t-fail { color: #c0453c; font-weight: 700; }
  #stage { padding: 0 12px; }
</style>
</head>
<body>
<!-- Escenario real montado en el DOM, con el CSS de produccion -->
<div class="app" id="stage">
  <main>
    <section class="table">
      <div class="board">
        <div class="legend" id="legend"></div>
        <div class="runes" id="runes"></div>
      </div>
    </section>
    <p class="ask">Pregunta de ejemplo con un texto largo para ver si fuerza el ancho de la pagina</p>
  </main>
</div>
<pre id="out"></pre>

<script type="module">
import { renderCard } from '../src/ui/card.js';
import { renderRune } from '../src/ui/rune.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

function check(name, cond, extra = '') {
  const ok = !!cond;
  ok ? pass++ : fail++;
  const line = document.createElement('div');
  line.className = ok ? 't-pass' : 't-fail';
  line.textContent = `${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ' :: ' + extra : ''}`;
  out.appendChild(line);
}

const card = (id, name, energy = 1, power = {}, domain = 'fury') =>
  ({ id, name, energy, power, type: 'unit', might: 3, domain, text: 'Texto de reglas.' });

// ---- La proporcion real de la carta (boca abajo, como en la mano del rival)
const dorsoCard = renderCard(card('k', 'Dorso'), { faceUp: false });
dorsoCard.style.width = '90px';
document.querySelector('#stage main').appendChild(dorsoCard);
const cardBox = dorsoCard.getBoundingClientRect();
const ratio = cardBox.width / cardBox.height;
check('Carta en proporcion 63:88', Math.abs(ratio - 63 / 88) < 0.02, ratio.toFixed(3));

// ---- El dorso es el dorso real de la carta, no un dibujo
const dorso = getComputedStyle(dorsoCard.querySelector('.card__face--back'));
check('Dorso: usa la imagen real', dorso.backgroundImage.includes('assets/card-back.png'),
  dorso.backgroundImage.slice(0, 60));
check('Dorso: sin el circulo dibujado', !dorsoCard.querySelector('.card__back-mark'));
dorsoCard.remove();

// ---- Sin arte, la carta sigue siendo legible: nunca un hueco
const sinArte = renderCard(card('x', 'Sin Arte'), { faceUp: true });
document.body.appendChild(sinArte);
check('Sin img, la ventana de arte se dibuja igual',
  sinArte.querySelector('.card__art').classList.contains('card__art--empty'));
check('Sin img, el nombre sigue visible', sinArte.querySelector('.card__name').textContent === 'Sin Arte');
sinArte.remove();

// ---- Con arte, la carta ES la imagen: sin marco blanco, sin pips, sin texto dibujado
const PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
const conArte = renderCard({ ...card('y', 'Con Arte'), img: PNG }, { faceUp: true });
document.body.appendChild(conArte);
const oculto = (sel) => {
  const n = conArte.querySelector(sel);
  return !n || getComputedStyle(n).display === 'none';
};
check('Con img, no se dibuja el cuerpo blanco', oculto('.card__body'));
check('Con img, no se dibujan los pips de coste', oculto('.card__costs'));
check('Con img, no se dibuja la banda de dominio', oculto('.card__band'));
const faceBox = conArte.querySelector('.card__face--front').getBoundingClientRect();
const artBox = conArte.querySelector('.card__art').getBoundingClientRect();
check('Con img, el arte ocupa toda la carta',
  Math.abs(artBox.height - faceBox.height) <= 2, `${artBox.height.toFixed(1)} / ${faceBox.height.toFixed(1)}`);
conArte.remove();

// ---- Las runas en mesa son CARTAS de runa, no circulos con una letra
const runaAbierta = renderRune({ domain: 'fury', ready: true });
const runaAgotada = renderRune({ domain: 'order', ready: false });
document.body.append(runaAbierta, runaAgotada);
const imgRuna = runaAbierta.querySelector('img');
check('Runa: se dibuja con la imagen oficial de su dominio', !!imgRuna && /f95ed6ba/.test(imgRuna.src));
check('Runa: sin letra suelta como texto', runaAbierta.textContent.trim().length > 1,
  runaAbierta.textContent);
const rAbierta = runaAbierta.querySelector('.rune__card').getBoundingClientRect();
check('Runa abierta: parada, en proporcion de carta', rAbierta.height > rAbierta.width,
  `${rAbierta.width.toFixed(1)}x${rAbierta.height.toFixed(1)}`);
check('Runa agotada: tumbada como en la mesa',
  /matrix\(0, 1, -1, 0|matrix\(6\.1/.test(getComputedStyle(runaAgotada.querySelector('.rune__card')).transform),
  getComputedStyle(runaAgotada.querySelector('.rune__card')).transform);
check('Runa: el lector de pantalla sabe dominio y estado',
  runaAgotada.getAttribute('aria-label') === 'Order agotada');
check('Runa: se lee su dominio debajo', runaAbierta.querySelector('.rune__label')?.textContent === 'Fury');
check('Runa agotada: lo dice en palabras', runaAgotada.querySelector('.rune__label')?.textContent === 'Order · agotada');
check('Runa: grande, al menos 48px de ancho', rAbierta.width >= 48, rAbierta.width.toFixed(1));
runaAbierta.remove(); runaAgotada.remove();

// ---- La leyenda del rival, boca arriba a la IZQUIERDA de las runas: dice que mazo es
const PNG_L = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
const legendEl = document.getElementById('legend');
legendEl.appendChild(renderCard({ id: 'ley', name: 'Leyenda', type: 'legend', domain: 'chaos', img: PNG_L },
  { faceUp: true }));
for (let i = 0; i < 7; i++) {
  document.getElementById('runes').appendChild(renderRune({ domain: i % 2 ? 'chaos' : 'order', ready: true }));
}
const legBox = legendEl.querySelector('.card').getBoundingClientRect();
const runasBox = document.getElementById('runes').getBoundingClientRect();
check('Leyenda: boca arriba', legendEl.querySelector('.card').dataset.face === 'up');
check('Leyenda: a la izquierda de las runas', legBox.right <= runasBox.left + 1,
  `${legBox.right.toFixed(0)} vs ${runasBox.left.toFixed(0)}`);
check('Leyenda: en la misma fila que las runas', legBox.top < runasBox.bottom && runasBox.top < legBox.bottom);
check('Leyenda: mas grande que una runa', legBox.width >= 64, legBox.width.toFixed(1));

// El campeon elegido tambien esta boca arriba en la mesa: debajo de la leyenda, misma columna
legendEl.appendChild(renderCard({ id: 'camp', name: 'Campeon', type: 'unit', domain: 'chaos', img: PNG_L },
  { faceUp: true }));
const [cLey, cCamp] = [...legendEl.querySelectorAll('.card')].map((c) => c.getBoundingClientRect());
check('Campeon: debajo de la leyenda, separado', cCamp.top >= cLey.bottom + 6,
  `${cCamp.top.toFixed(0)} vs ${cLey.bottom.toFixed(0)}`);
check('Campeon: en la misma columna', Math.abs(cCamp.left - cLey.left) <= 1);

// En pantalla ancha sobra margen: la leyenda sale del panel negro, a su izquierda.
// (Container query: se prueba con un contenedor de ancho fijo, no con la ventana.)
const ancha = document.createElement('div');
ancha.style.cssText = 'container-type: inline-size; width: 1200px; position: absolute; left: -99999px; top: 0;';
ancha.innerHTML = '<div class="app"><section class="table"><div class="board">' +
  '<div class="legend"></div><div class="runes"></div></div></section></div>';
document.body.appendChild(ancha);
ancha.querySelector('.legend').appendChild(renderCard(
  { id: 'ley2', name: 'Leyenda', type: 'legend', domain: 'chaos', img: PNG_L }, { faceUp: true }));
const legAncha = ancha.querySelector('.legend .card').getBoundingClientRect();
const mesaAncha = ancha.querySelector('.table').getBoundingClientRect();
check('Leyenda ancha: FUERA del panel, a la izquierda', legAncha.right <= mesaAncha.left - 8,
  `${legAncha.right.toFixed(0)} vs ${mesaAncha.left.toFixed(0)}`);
check('Leyenda ancha: alineada arriba con el panel', Math.abs(legAncha.top - mesaAncha.top) <= 2,
  `${legAncha.top.toFixed(0)} vs ${mesaAncha.top.toFixed(0)}`);
ancha.remove();

// ---- QUIEN DESBORDA A LO ANCHO (esto es lo que el screenshot mostro)
const docW = document.documentElement.clientWidth;

// Un hijo dentro de un contenedor con overflow:auto sigue reportando su posicion
// REAL en getBoundingClientRect aunque este clipeado. Contarlo como desborde seria
// un falso positivo: lo que importa es que el contenedor scrollee, no la pagina.
const dentroDeScroller = (node) => {
  for (let p = node.parentElement; p && p !== document.body; p = p.parentElement) {
    const ov = getComputedStyle(p).overflowX;
    if (ov === 'auto' || ov === 'scroll' || ov === 'hidden' || ov === 'clip') return true;
  }
  return false;
};

const culpables = [];
for (const node of document.querySelectorAll('#stage *')) {
  if (dentroDeScroller(node)) continue;
  const r = node.getBoundingClientRect();
  if (r.right > docW + 1 || r.left < -1) {
    culpables.push(`${node.tagName}.${node.className || '(sin clase)'} [${Math.round(r.left)}..${Math.round(r.right)}]`);
  }
}
check(`Nada desborda de ${docW}px`, culpables.length === 0, culpables.slice(0, 6).join(' | '));

// El que manda: la PAGINA no puede scrollear en horizontal, pase lo que pase.
const docSW = document.documentElement.scrollWidth;
let quien = '';
if (docSW > docW + 1) {
  for (const node of document.querySelectorAll('body *')) {
    const r = node.getBoundingClientRect();
    if (r.right > docW + 1) { quien = `${node.tagName}.${node.className} hasta ${Math.round(r.right)}`; break; }
  }
}
check('El documento no scrollea en horizontal', docSW <= docW + 1,
  `scrollWidth ${docSW} vs ${docW} — primero: ${quien || 'nadie'}`);

// Cartas de prueba del abanico (el muro de casilleros se reemplazó por la mano en abanico).
const wallCards = [
  { ...card('w1', 'Chispa', 1, {}, 'order'), img: PNG },
  { ...card('w2', 'Descarga', 2, { chaos: 1 }, 'chaos'), img: PNG },
  { ...card('w3', 'Granada', 3, { order: 2 }, 'order'), img: null },
  { ...card('w4', 'Motin', 9, {}, 'chaos'), img: PNG },
];

// ---- LA MANO DEL RIVAL EN ABANICO (AC-FAN): tantos dorsos como cartas pagables, sin identidad.
const { mountRivalFan, fanAngles } = await import('../src/ui/rival-fan.js');
const near = (a, b) => Math.abs(a - b) < 0.51;
check('AC-FAN-03: fanAngles abre un arco simétrico y creciente de min(96, 4.4*N) grados',
  [3, 6, 21, 30].every((n) => {
    const angles = fanAngles(n);
    const spread = Math.min(96, 4.4 * n);
    return angles.length === n && near(angles[0], -spread / 2) && near(angles.at(-1), spread / 2) &&
      angles.every((a, i) => i === 0 || a > angles[i - 1]) && near(angles[0], -angles.at(-1));
  }) && fanAngles(1).join() === '0' && fanAngles(0).length === 0, fanAngles(3).join());
const fanHost = document.createElement('div');
document.querySelector('#stage main').appendChild(fanHost);
let fan = mountRivalFan(fanHost, { size: 3 });
const fanSlots = () => [...fanHost.querySelectorAll('.fan__card')];
const fanStates = () => fanSlots().map((slot) => slot.dataset.state).join(',');
check('AC-FAN-01: la mano tiene exactamente N cartas boca abajo con el dorso real, sin "desconocido" ni números',
  fanSlots().length === 3 && fanStates() === 'down,down,down' &&
  fanSlots().every((slot) => slot.querySelector('.card[data-face="down"] .card__face--back') &&
    getComputedStyle(slot.querySelector('.card__face--back')).backgroundImage.includes('card-back')) &&
  !/desconocid|\d/i.test(fanHost.textContent));
check('AC-FAN-03: cada carta lleva su ángulo de fanAngles en --a',
  fanSlots().map((slot) => parseFloat(slot.style.getPropertyValue('--a'))).every((a, i) => near(a, fanAngles(3)[i])));
check('AC-FAN-21: la mano es un grupo "Mano del rival"; los dorsos no tienen identidad ni foco',
  fanHost.querySelector('.fan')?.getAttribute('role') === 'group' &&
  fanHost.querySelector('.fan').getAttribute('aria-label') === 'Mano del rival' &&
  !fanHost.querySelector('.fan [data-card-id], .fan [tabindex]'));
fan.reveal(wallCards[1], { fresh: true });
const slot0 = fanSlots()[0];
check('AC-FAN-04: un acierto da vuelta el PRIMER dorso con esa carta, su imagen, nombre y brillo de dominio',
  fanStates() === 'found,down,down' && slot0.dataset.cardId === 'w2' && slot0.dataset.glow === 'chaos' &&
  slot0.querySelector('.card').dataset.face === 'up' && !!slot0.querySelector('.card__face--image img') &&
  /Descarga/.test(slot0.querySelector('.card').getAttribute('aria-label')));
fan.reveal(wallCards[0], { fresh: true });
check('AC-FAN-05: el segundo acierto va al slot siguiente, en orden de nombrado, y sólo el último brilla como nuevo',
  fanStates() === 'found,found,down' && fanSlots()[1].dataset.cardId === 'w1' &&
  fanSlots()[1].hasAttribute('data-fresh') && !fanSlots()[0].hasAttribute('data-fresh'));
fanHost.getAnimations({ subtree: true }).forEach((animation) => animation.finish());
const zOf = (slot) => Number(getComputedStyle(slot).zIndex);
check('AC-FAN-06: la carta acertada queda al frente y levantada respecto de un dorso',
  fanSlots().slice(0, 2).every((slot) => zOf(slot) > zOf(fanSlots()[2])) &&
  parseFloat(getComputedStyle(fanSlots()[0]).getPropertyValue('--lift')) < 0 &&
  !parseFloat(getComputedStyle(fanSlots()[2]).getPropertyValue('--lift')),
  `${fanSlots().map(zOf)} | lift ${fanSlots().map((slot) => getComputedStyle(slot).getPropertyValue('--lift'))}`);
fan.setFound([wallCards[3], wallCards[2]]);
check('AC-FAN-14: setFound llena los primeros slots en orden, sin brillo, y tapa el resto',
  fanStates() === 'found,found,down' && fanSlots()[0].dataset.cardId === 'w4' && fanSlots()[1].dataset.cardId === 'w3' &&
  !fanHost.querySelector('[data-glow], [data-fresh]') && !fanSlots()[2].hasAttribute('data-card-id') &&
  fanSlots()[2].querySelector('.card').dataset.face === 'down');
fan.reveal(wallCards[0]);
fan.reveal(wallCards[1]);
check('AC-FAN-04: con la mano llena, un acierto de más no rompe nada ni agrega cartas',
  fanSlots().length === 3 && fanStates() === 'found,found,found');
fan.destroy();

// Cierre: los dorsos que quedaron muestran en gris lo que se pasó; los falsos positivos, al costado.
fan = mountRivalFan(fanHost, { size: 3 });
fan.reveal(wallCards[0], { fresh: true });
const missedReason = 'Se podía pagar: 2 + 1 Chaos';
const fpReason = 'Pide 9 de Energía y hay 3 runas abiertas';
fan.showOutcomes({
  missed: [{ card: wallCards[1], reason: missedReason }, { card: wallCards[2], reason: 'Se podía pagar: 3 + 2 Order' }],
  falsePositives: [{ card: wallCards[3], reason: fpReason }],
});
fanHost.getAnimations({ subtree: true }).forEach((animation) => animation.finish());
const fanWhy = fanHost.querySelector('.fan__why');
const extras = [...fanHost.querySelectorAll('.fan__extra')];
check('AC-FAN-10: los dorsos restantes muestran las que faltaron, en orden, boca arriba y en gris',
  fanStates() === 'found,missed,missed' && fanSlots()[1].dataset.cardId === 'w2' && fanSlots()[2].dataset.cardId === 'w3' &&
  fanSlots().slice(1).every((slot) => slot.querySelector('.card').dataset.face === 'up' &&
    /grayscale\(1\)/.test(getComputedStyle(slot.querySelector('.card__face--front')).filter) &&
    // un filter sobre la carta que gira la aplana: se vería el dorso espejado en vez de la cara
    getComputedStyle(slot.querySelector('.card')).filter === 'none'));
check('AC-FAN-10: las que faltaron son focusables y llevan su motivo; el acierto no explica nada',
  fanSlots()[1].tabIndex === 0 && fanSlots()[1].getAttribute('aria-label').includes(missedReason) &&
  !fanSlots()[0].hasAttribute('tabindex') && !fanSlots()[0].hasAttribute('data-reason'));
check('AC-FAN-21: el motivo vive en una región role=status siempre presente y vacía',
  fanWhy?.getAttribute('role') === 'status' && !fanWhy.hidden && fanWhy.textContent === '');
fanSlots()[1].dispatchEvent(new Event('focusin', { bubbles: true }));
const whyMissed = fanWhy.textContent;
extras[0]?.dispatchEvent(new Event('pointerenter'));
const whyFp = fanWhy.textContent;
fanSlots()[0].dispatchEvent(new Event('pointerenter'));
check('AC-FAN-10: focus, puntero o toque muestran el motivo de ESA carta; una carta sin motivo vacía la explicación',
  whyMissed === missedReason && whyFp === fpReason && fanWhy.textContent === '');
const extraTag = extras[0]?.querySelector('.fan__tag');
check('AC-FAN-11: cada falso positivo es una carta extra fuera del arco, boca arriba, inclinada, con NO ENTRABA legible',
  extras.length === 1 && !extras[0].closest('.fan') && extras[0].dataset.cardId === 'w4' &&
  extras[0].querySelector('.card').dataset.face === 'up' && getComputedStyle(extras[0]).transform !== 'none' &&
  extraTag?.textContent === 'NO ENTRABA' && parseFloat(getComputedStyle(extraTag).fontSize) >= 11 &&
  extras[0].tabIndex === 0 && extras[0].getAttribute('aria-label').includes(fpReason));
check('AC-FAN-13: el cierre no muestra porcentajes, "N de M", "N/M" ni contadores',
  !/%|\b\d+\s*(de|\/)\s*\d+\b|aciertos?:|faltan(tes)?:|errores?:/i.test(fanHost.textContent.replace(missedReason, '').replace(fpReason, '')));
const sheetRule = (selector, pattern) => [...document.styleSheets].some((sheet) => {
  try { return [...sheet.cssRules].some((rule) => rule.selectorText?.includes(selector) && pattern.test(rule.cssText)); }
  catch { return false; }
});
check('AC-FAN-07: pasar el mouse o enfocar una carta la levanta y la trae al frente',
  sheetRule('.fan__card:hover .card', /translate/) && sheetRule('.fan__card:hover', /z-index/) &&
  sheetRule('.fan__card:focus-visible .card', /translate/) && sheetRule('.fan__card:focus-visible', /outline/));
check('AC-FAN-21: con motivo, el nombre se lee una sola vez (carta y rótulo internos ocultos al lector)',
  fanSlots()[1].querySelector('.card').getAttribute('aria-hidden') === 'true' &&
  extras[0].querySelector('.card').getAttribute('aria-hidden') === 'true' && extraTag.getAttribute('aria-hidden') === 'true');
fan.reset();
check('AC-FAN-14: reset tapa todo, quita las extras y vacía el motivo',
  fanStates() === 'down,down,down' && !fanHost.querySelector('.fan__extra, [tabindex], [data-reason]') && fanWhy.textContent === '');
fan.destroy();

// Contención: con la mano más grande, todo (puntas, levantadas, extras, motivo) queda adentro y nada lo tapa.
const fanCards = Array.from({ length: 21 }, (_, i) => ({ ...card(`f${i}`, `Carta ${i}`, 1, {}, 'order'), img: PNG }));
const inBox = (inner, outer) => inner.left >= outer.left - 1 && inner.right <= outer.right + 1 &&
  inner.top >= outer.top - 1 && inner.bottom <= outer.bottom + 1;
for (const [width, height] of [[1256, 470], [520, 250], [288, 250]]) {
  const box = document.createElement('div');
  box.style.cssText = `width:${width}px;height:${height + 400}px;position:relative`;
  document.querySelector('#stage main').appendChild(box);
  const big = mountRivalFan(box, { size: 21 });
  for (const item of fanCards.slice(0, 10)) big.reveal(item);
  big.showOutcomes({ missed: fanCards.slice(10).map((item) => ({ card: item, reason: 'Se podía pagar: 1' })),
    falsePositives: fanCards.slice(0, 3).map((item) => ({ card: item, reason: 'Pide más de lo que hay' })) });
  box.getAnimations({ subtree: true }).forEach((animation) => animation.finish());
  box.querySelector('.fan__card[data-reason]').dispatchEvent(new Event('focusin', { bubbles: true }));
  const zone = box.querySelector('.fan-zone').getBoundingClientRect();
  const wrap = box.querySelector('.fan-wrap').getBoundingClientRect();
  const cardsInZone = [...box.querySelectorAll('.fan__card')].every((item) => inBox(item.getBoundingClientRect(), zone));
  const extraBoxes = [...box.querySelectorAll('.fan__extra')].map((item) => item.getBoundingClientRect());
  // Nada lo tapa: no se cruza con ninguna carta del arco (elementFromPoint no sirve fuera de la ventana).
  const arcRects = [...box.querySelectorAll('.fan__card')].map((item) => item.getBoundingClientRect());
  const visible = (rect) => arcRects.every((arc) => rect.right <= arc.left + 1 || rect.left >= arc.right - 1 || rect.bottom <= arc.top + 1 || rect.top >= arc.bottom - 1);
  const whyRect = box.querySelector('.fan__why').getBoundingClientRect();
  check(`AC-FAN-19: a ${width}x${height} con 21 cartas, todas (también las levantadas) quedan dentro del área del abanico`,
    cardsInZone && wrap.right <= width + box.getBoundingClientRect().left + 1,
    [...box.querySelectorAll('.fan__card')].map((item) => item.getBoundingClientRect()).filter((r) => !inBox(r, zone)).slice(0, 2)
      .map((r) => `${Math.round(r.left)},${Math.round(r.top)}-${Math.round(r.right)},${Math.round(r.bottom)} zona ${Math.round(zone.left)},${Math.round(zone.top)}-${Math.round(zone.right)},${Math.round(zone.bottom)}`).join(' | '));
  check(`AC-FAN-11: a ${width}x${height} las extras y el motivo quedan dentro del ancho, fuera del arco y a la vista`,
    extraBoxes.length === 3 && extraBoxes.every((rect) => rect.left >= box.getBoundingClientRect().left - 1 && rect.right <= box.getBoundingClientRect().right + 1 &&
      !inBox(rect, zone) && visible(rect)) && whyRect.top >= zone.bottom - 1 && visible(whyRect));
  big.destroy(); box.remove();
}
fan = mountRivalFan(fanHost, { size: 0 });
check('AC-FAN-02: un nivel sin pagables tiene la mano vacía', fanSlots().length === 0 && !!fanHost.querySelector('.fan'));
fan.destroy();
check('AC-FAN-21: destroy deja el contenedor vacío', fanHost.children.length === 0);
fanHost.remove();

// ---- EL DOCK (AC-ARC-32): un solo input; sugiere desde TODO el main y nombrar es un acto.
const { normalizeDeck, checkCard, payableCards } = await import('../src/engine/deck-combos.js');
const { createRecallScenario } = await import('../src/engine/recall-scenario.js');
const { mountComposer } = await import('../src/ui/composer.js');
const type = (root, text) => {
  const input = root.querySelector('input[role="combobox"]');
  input.value = text;
  input.dispatchEvent(new Event('input', { bubbles: true }));
  return input;
};
const press = (input, key) => input.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
const sampleCards = [
  { id: 'alpha', name: 'Álpha', energy: 1, power: {}, img: PNG, type: 'unit', domain: 'order' },
  { id: 'beta', name: 'Beta', energy: 3, power: { chaos: 1 }, img: null, type: 'spell', domain: 'chaos' },

const phoneShape = [...liveDoc.querySelectorAll('.recall > *')].map((item) => item.className).join('|');
// Cierre a 320: ~21 celdas con sus cuatro estados, todas alcanzables sin scroll horizontal.
liveDoc.querySelector('#recall-root [data-action="finish"]').click();
liveFrame.contentDocument.getAnimations().forEach((animation) => animation.finish());
const closedPhone = [...liveDoc.querySelectorAll('#recall-root .fan__card, #recall-root .fan__extra')];
check('AC-FAN-19: el cierre a 320 no desborda y todas las cartas quedan dentro del ancho',
  liveDoc.querySelector('.recall').dataset.phase === 'closed' && closedPhone.length > 0 &&
  liveDoc.documentElement.scrollWidth <= liveDoc.documentElement.clientWidth + 1 &&
  closedPhone.every((slot) => slot.getBoundingClientRect().left >= -1 && slot.getBoundingClientRect().right <= liveDoc.documentElement.clientWidth + 1),
  `${liveDoc.documentElement.scrollWidth} / ${liveDoc.documentElement.clientWidth}`);
liveFrame.remove();

// ---- DESKTOP (AC-ARC-54, 57): pantalla completa 1280x800, sin scroll de página.
// Peor caso FIJO, no el seed al azar de la app: seed 1234 nivel 3 = 12 runas con 9 agotadas (tumbadas,
// las mas anchas), asi las runas van en dos filas y la banda crece. La historia se juega de verdad.
actualStore.clear();
const deskIndex = normalizeDeck(liveDeck, realData.cards, { policy: 'positive-energy' }).index;
const deskScenario = (level) => createRecallScenario(liveDeck, deskIndex, 1234, level).scenario;
let deskState = startRecall(deskScenario(1), deskIndex).state;
for (let level = 2; level <= 3; level++) {
  for (const cardId of deskState.payable) deskState = reduceRecall(deskState, { type: 'name', cardId }, deskIndex).state;
  deskState = reduceRecall(deskState, { type: deskState.payable.length ? 'finish' : 'skip' }, deskIndex).state;
  deskState = advanceRecall(deskState, deskScenario(level), deskIndex).state;
}
check('AC-ARC-54: el fixture de escritorio es la mesa más ancha (12 runas, 9 agotadas), guardada por el store real',
  deskState.scenario.level === 3 && deskState.scenario.runes.length === 12 && deskState.scenario.runes.filter((r) => !r.ready).length === 9 && actualStore.saveRecallSnapshot(deskState).ok === true,
  `${deskState.scenario.level} / ${deskState.scenario.runes.length}`);
const deskFrame = document.createElement('iframe');
deskFrame.title = 'App real en escritorio';
deskFrame.style.cssText = 'width:1280px;height:800px;border:0;display:block';
deskFrame.src = '../index.html';
document.querySelector('#stage main').appendChild(deskFrame);
await new Promise((resolve) => { deskFrame.onload = resolve; });
await deskFrame.contentWindow.__riftrainReady;
const deskWin = deskFrame.contentWindow;
const deskDoc = deskFrame.contentDocument;
const dq = (selector) => deskDoc.querySelector(selector);
const rect = (selector) => dq(selector).getBoundingClientRect();
const inside = (inner, outer) => inner.left >= outer.left - 1 && inner.right <= outer.right + 1 &&
  inner.top >= outer.top - 1 && inner.bottom <= outer.bottom + 1;
const fanCardsDesk = () => [...deskDoc.querySelectorAll('.recall .fan__card')];
deskDoc.getAnimations().forEach((animation) => animation.finish());
check('AC-FAN-18: a 1280x800 el orden es banda, mano, dock (de arriba hacia abajo)',
  rect('.recall-band').bottom <= rect('.fan-wrap').top + 1 && rect('.fan-wrap').bottom <= rect('.recall-dock').top + 1);
check('AC-ARC-54: la página entera cabe en 1280x800 sin scroll, ni vertical ni horizontal',
  deskDoc.documentElement.scrollHeight <= deskWin.innerHeight && deskDoc.documentElement.scrollWidth <= deskDoc.documentElement.clientWidth + 1,
  `${deskDoc.documentElement.scrollHeight} / ${deskWin.innerHeight}`);
check('AC-ARC-54: la mesa más ancha entra en una sola fila de runas',
  new Set([...deskDoc.querySelectorAll('.recall-band .rune')].map((rune) => Math.round(rune.getBoundingClientRect().bottom))).size === 1);
check('AC-ARC-54: runas y leyenda quedan dentro de la banda',
  deskDoc.querySelectorAll('.recall-band .rune').length > 0 &&
  [...deskDoc.querySelectorAll('.recall-band .rune, .recall-band .legend .card')]
    .every((item) => inside(item.getBoundingClientRect(), rect('.recall-band'))));
check('AC-FAN-18: la mano tiene tantos dorsos como pagables, todos dentro de su área, sin pisar el dock y legibles', (() => {
  const zone = rect('.fan-zone');
  const cards = fanCardsDesk();
  return cards.length > 0 && cards.length === deskState.payable.length && cards.every((slot) => inside(slot.getBoundingClientRect(), zone)) &&
    zone.bottom <= rect('.recall-dock').top + 1 && cards[0].offsetWidth >= 80 &&
    cards.every((slot) => Math.abs(slot.offsetWidth / slot.querySelector('.card').offsetHeight - 63 / 88) < 0.02);
})(), `${fanCardsDesk().length} cartas, ancho ${fanCardsDesk()[0]?.offsetWidth}, zona ${Math.round(rect('.fan-zone').width)}x${Math.round(rect('.fan-zone').height)}`);
check('AC-ARC-54: la mesa es oscura de punta a punta y no hay un panel claro suelto',
  (getComputedStyle(deskDoc.body).backgroundColor.match(/\d+/g) ?? []).slice(0, 3).every((value) => Number(value) < 60));
check('AC-ARC-57 + AC-SHL-05: en escritorio la pantalla es una grilla de tres zonas (banda, mano, dock); en una ventana baja vuelve a fluir',
  getComputedStyle(dq('.recall')).display === 'grid' && deskDoc.querySelectorAll('.recall > *').length === 3 &&
  [...deskDoc.querySelectorAll('.recall > *')].map((item) => item.className).join('|') === phoneShape);
const deskInput = dq('.recall input[role="combobox"]');
deskInput.focus();
const focusStyle = getComputedStyle(deskInput);
check('AC-ARC-60: el input enfocado tiene un anillo visible',
  focusStyle.outlineStyle !== 'none' && parseFloat(focusStyle.outlineWidth) >= 2);
deskInput.value = 'gust';
deskInput.dispatchEvent(new Event('input', { bubbles: true }));
check('AC-ARC-54: las sugerencias se abren hacia arriba y no agregan scroll a la página',
  deskDoc.querySelectorAll('.recall [role="option"]').length > 0 &&
  dq('.recall-composer__list').getBoundingClientRect().bottom <= deskInput.getBoundingClientRect().top + 1 &&
  deskDoc.documentElement.scrollHeight <= deskWin.innerHeight,
  `${deskDoc.querySelectorAll('.recall [role="option"]').length} ${dq('.recall-composer__list').getBoundingClientRect().bottom} ${deskInput.getBoundingClientRect().top} ${deskDoc.documentElement.scrollHeight}`);
// Escritorio angosto: la mano sigue entera dentro de su área y nada desborda (la banda ya no tiene la columna de los dorsos).
deskFrame.style.width = '1024px';
const narrowRows = new Set([...deskDoc.querySelectorAll('.recall-band .rune')].map((rune) => Math.round(rune.getBoundingClientRect().bottom))).size;
check('AC-FAN-18: a 1024 la mano entra en su área y nada desborda',
  getComputedStyle(dq('.recall')).display === 'grid' &&
  fanCardsDesk().every((slot) => inside(slot.getBoundingClientRect(), rect('.fan-zone'))) &&
  deskDoc.documentElement.scrollWidth <= deskDoc.documentElement.clientWidth + 1,
  `${narrowRows} filas, sw=${deskDoc.documentElement.scrollWidth}`);
deskFrame.style.width = '1200px';
// Cierre con MUCHOS falsos positivos: se nombran todas las que no entran en ese nivel (las elige el motor; son 4).
const deskUnpayable = deskIndex.cards.filter(({ id }) => !checkCard(id, deskState.scenario, deskIndex).ok).slice(0, 5)
  .map(({ id }) => realData.cards.find((item) => item.id === id).name);
for (const cardName of deskUnpayable) press(type(dq('#recall-root'), cardName), 'Enter');
dq('.recall [data-action="finish"]').click();
deskDoc.getAnimations().forEach((animation) => animation.finish());
check('AC-FAN-18: el cierre a 1200 no desborda: las que faltaron, en gris, quedan dentro del área de la mano',
  dq('.recall').dataset.phase === 'closed' && deskDoc.querySelectorAll('.recall .fan__card[data-state="missed"]').length > 0 &&
  deskDoc.documentElement.scrollWidth <= deskDoc.documentElement.clientWidth + 1 &&
  fanCardsDesk().every((slot) => inside(slot.getBoundingClientRect(), rect('.fan-zone'))),
  `${deskDoc.documentElement.scrollWidth} / ${deskDoc.documentElement.clientWidth}`);
const deskExtras = [...deskDoc.querySelectorAll('.recall .fan__extra')];
check('AC-FAN-18: con cuatro o más falsos positivos, las extras quedan dentro de la fila de la mano, sin pisar el dock ni el arco',
  deskUnpayable.length >= 4 && deskExtras.length === deskUnpayable.length &&
  deskExtras.every((item) => { const box = item.getBoundingClientRect();
    return inside(box, rect('.fan-wrap')) && box.bottom <= rect('.recall-dock').top + 1 && !inside(box, rect('.fan-zone')); }) &&
  deskDoc.documentElement.scrollHeight <= deskWin.innerHeight,
  `${deskExtras.length} extras; ${deskExtras.map((item) => Math.round(item.getBoundingClientRect().bottom)).join(',')} vs fila ${Math.round(rect('.fan-wrap').bottom)} dock ${Math.round(rect('.recall-dock').top)}; enWrap ${deskExtras.map((i) => inside(i.getBoundingClientRect(), rect('.fan-wrap')))} enZona ${deskExtras.map((i) => inside(i.getBoundingClientRect(), rect('.fan-zone')))} x ${deskExtras.map((i) => Math.round(i.getBoundingClientRect().left) + '-' + Math.round(i.getBoundingClientRect().right))} wrap ${Math.round(rect('.fan-wrap').left)}-${Math.round(rect('.fan-wrap').right)} sh ${deskDoc.documentElement.scrollHeight}/${deskWin.innerHeight}`);
deskFrame.style.width = '1280px';
deskFrame.style.height = '600px';
check('AC-ARC-57: con ventana baja (1280x600) la misma pantalla deja de ser grilla de pantalla completa',
  getComputedStyle(dq('.recall')).display !== 'grid');
deskFrame.remove();

// ---- Celebración al cerrar completo (AC-CEL-11..17) ----
{
  const celMount = document.createElement('div');
  document.querySelector('#stage main').appendChild(celMount);
  const celDeck = { id: 'cel', name: 'Deck festejo', runes: { order: 12 },
    cards: [{ cardId: 'alpha', qty: 1 }, { cardId: 'gamma', qty: 1 }, { cardId: 'beta', qty: 1 }] };
  const celIndex = normalizeDeck(celDeck, flowCards).index;
  // Un nivel con exactamente dos pagables (alpha y gamma): lo elige el motor, no el test.
  const celLevel = [1, 2, 3, 4, 5, 6].find((level) =>
    payableCards(celIndex, createRecallScenario(celDeck, celIndex, 7, level).scenario).cardIds.length === 2);
  const cel = (options = {}) => mountRecall(celMount, { deck: celDeck, cards: flowCards, seed: 7, initialLevel: celLevel,
    storage: stub, ...options });
  const banner = () => celMount.querySelector('.celebration__banner:not([hidden])');
  const pieces = () => celMount.querySelectorAll('.celebration__piece');
  const act = (name) => celMount.querySelector(`[data-action="${name}"]`);
  let run = cel();
  press(type(celMount, 'alp'), 'Enter');
  check('AC-CEL-11: con una pagable pendiente no hay cartel', !!celLevel && !banner() && act('finish').hidden === false);
  press(type(celMount, 'gam'), 'Enter');
  check('AC-CEL-11: nombrar la última pagable muestra "Nivel terminado" sin tocar Terminé, con el foco en Siguiente nivel',
    banner()?.textContent === 'Nivel terminado' && banner().getAttribute('aria-hidden') === 'true' &&
    act('next').hidden === false && act('finish').hidden === true && document.activeElement === act('next') &&
    /Nivel terminado/.test(celMount.querySelector('.recall__message').textContent));
  const layer = celMount.querySelector('.celebration');
  check('AC-CEL-12: el confetti son 20+ piezas que no reciben clics ni hacen scroll horizontal',
    pieces().length >= 20 && getComputedStyle(layer).pointerEvents === 'none' &&
    [...pieces()].every((piece) => getComputedStyle(piece).pointerEvents === 'none') &&
    document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1,
    `${pieces().length} sw=${document.documentElement.scrollWidth}/${document.documentElement.clientWidth}`);
  act('next').click();
  check('AC-CEL-16: Siguiente nivel retira cartel y confetti y arranca con todos los dorsos',
    !banner() && pieces().length === 0 && [...celMount.querySelectorAll('.fan__card')].every((slot) => slot.dataset.state === 'down'));
  run.destroy();
  check('AC-CEL-16: desmontar no deja la capa de festejo', !document.querySelector('.celebration'));

  run = cel({ reducedMotion: true });
  press(type(celMount, 'alp'), 'Enter');
  press(type(celMount, 'gam'), 'Enter');
  check('AC-CEL-13: con movimiento reducido hay cartel y cero confetti', !!banner() && pieces().length === 0);
  run.destroy();

  run = cel();
  press(type(celMount, 'bet'), 'Enter');
  press(type(celMount, 'alp'), 'Enter');
  press(type(celMount, 'gam'), 'Enter');
  check('AC-CEL-15: cerrar en revisión (hubo un falso positivo) no festeja',
    act('repeat').hidden === false && !banner() && pieces().length === 0);
  act('repeat').click();
  check('AC-CEL-19: Repetir con todo hallado cierra solo y festeja, con el foco en Siguiente nivel',
    act('next').hidden === false && act('finish').hidden === true && banner()?.textContent === 'Nivel terminado' &&
    document.activeElement === act('next'));
  run.destroy();

  run = cel();
  press(type(celMount, 'alp'), 'Enter');
  act('finish').click();
  act('repeat').click();
  check('AC-FAN-14: Repetir con pagables pendientes reabre el nivel, sin festejo, con el foco en el input',
    act('finish').hidden === false && !banner() && document.activeElement === celMount.querySelector('input[role="combobox"]'));
  run.destroy();

  const emptyDeck = { cards: [{ cardId: 'hard', qty: 1 }], runes: { order: 12 } };
  run = mountRecall(celMount, { deck: emptyDeck, cards: [{ id: 'hard', name: 'Hard', energy: 9, power: {} }], seed: 7, storage: stub });
  act('skip').click();
  check('AC-CEL-15: saltar un nivel sin pagables no festeja', !banner() && pieces().length === 0);
  run.destroy();

  run = mountRecall(celMount, { deck: terminalDeck, cards: [terminalCard], seed: 17, initialLevel: 12, storage: stub });
  press(type(celMount, 'costo uno'), 'Enter');
  check('AC-CEL-14: el nivel 12 completo dice "Entrenamiento completado"', banner()?.textContent === 'Entrenamiento completado');
  run.destroy();

  // Lo que se prueba es la UI al restaurar (el replay del store tiene sus tests en Node): el stub
  // devuelve el último estado guardado tal cual.
  let saved = null;
  const memo = { loadRecallSnapshot: () => (saved ? { ok: true, state: saved } : { ok: false }),
    saveRecallSnapshot: (state) => { saved = state; return { ok: true, persisted: true }; } };
  run = cel({ storage: memo });
  press(type(celMount, 'alp'), 'Enter');
  press(type(celMount, 'gam'), 'Enter');
  run.destroy();
  run = cel({ storage: memo });
  check('AC-CEL-17: recargar con el nivel ya cerrado no vuelve a festejar, pero Siguiente nivel sigue ahí',
    act('next').hidden === false && !banner() && pieces().length === 0);
  run.destroy();
  actualStore.clear();
  celMount.remove();
}

// ---- Nivel máximo en la pantalla (AC-CFG-10)
{
  const maxMount = document.createElement('div');
  document.querySelector('#stage main').appendChild(maxMount);
  const run = mountRecall(maxMount, { deck: terminalDeck, cards: [terminalCard], seed: 17, initialLevel: 3, maxLevel: 3, storage: stub });
  press(type(maxMount, 'costo uno'), 'Enter');
  check('AC-CFG-10: con máximo 3, completar el nivel 3 termina el entrenamiento, sin Siguiente nivel',
    maxMount.textContent.includes('Entrenamiento completado') && maxMount.querySelector('[data-action="next"]').hidden === true);
  run.destroy(); maxMount.remove();
}

// ---- Sin restos del modo legacy (AC-SHL-07/08)
{
  const handJs = await fetch('../src/ui/hand.js', { cache: 'no-store' });
  check('AC-SHL-07: src/ui/hand.js ya no existe', handJs.status === 404, String(handJs.status));
  const css = await (await fetch('../app.css', { cache: 'no-store' })).text();
  const legacy = ['.topbar', '.streak', '.timer', '.iconbtn', '.picks', '.pick', '.typebox', '.suggest', '.numpad',
    '.named', '.verdict', '.hand', '.chip', '.actions', '.zoom', '.recall__head', '.recall__level'];
  const left = legacy.filter((sel) => new RegExp('\\' + sel + '(?![\\w-])').test(css));
  check('AC-SHL-08: app.css no trae selectores del modo legacy ni del encabezado', left.length === 0, left.join(' '));
}

const head = document.createElement('div');
head.textContent = `\n=== ${pass} PASS / ${fail} FAIL ===`;
head.className = fail ? 't-fail' : 't-pass';
out.appendChild(head);
document.title = fail ? `FAIL(${fail})` : `PASS(${pass})`;
</script>
</body>
</html>
