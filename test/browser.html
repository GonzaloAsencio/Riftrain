<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riftrain — tests de navegador</title>
<link rel="stylesheet" href="../app.css">
<style>
  body { padding: 0; }
  /* pre-wrap: un mensaje largo no puede ensanchar la pagina y romper los checks de layout */
  #out { font-family: ui-monospace, monospace; font-size: 12px; padding: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .t-pass { color: #2f7d5a; }
  .t-fail { color: #c0453c; font-weight: 700; }
  #stage { padding: 0 12px; }
</style>
</head>
<body>
<!-- Escenario real montado en el DOM, con el CSS de produccion -->
<div class="app" id="stage">
  <main>
    <section class="table">
      <div class="board">
        <div class="legend" id="legend"></div>
        <div class="runes" id="runes"></div>
      </div>
      <div class="hand" id="hand"></div>
    </section>
    <p class="ask">Pregunta de ejemplo con un texto largo para ver si fuerza el ancho de la pagina</p>
    <div class="actions">
      <button class="btn btn--ghost">No hay mas</button>
      <button class="btn">Confirmar</button>
    </div>
  </main>
</div>
<pre id="out"></pre>

<script type="module">
import { Hand } from '../src/ui/hand.js';
import { renderCard } from '../src/ui/card.js';
import { renderRune } from '../src/ui/rune.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

function check(name, cond, extra = '') {
  const ok = !!cond;
  ok ? pass++ : fail++;
  const line = document.createElement('div');
  line.className = ok ? 't-pass' : 't-fail';
  line.textContent = `${ok ? 'PASS' : 'FAIL'} ${name}${extra ? ' :: ' + extra : ''}`;
  out.appendChild(line);
}

const card = (id, name, energy = 1, power = {}, domain = 'fury') =>
  ({ id, name, energy, power, type: 'unit', might: 3, domain, text: 'Texto de reglas.' });

const mano = [
  card('a', 'Chispa'), card('b', 'Recluta'), card('c', 'Descarga'),
  card('d', 'Artillera'), card('e', 'Detonante'), card('f', 'Motin'), card('g', 'Granada'),
];

const hand = new Hand(document.getElementById('hand'), mano);

// ---- LA REGLA 1: las cartas estan boca abajo DESDE EL PRINCIPIO
const slots = document.querySelectorAll('#hand .hand__slot');
check('R1 hay un slot por carta desde el arranque', slots.length === mano.length, `${slots.length}`);
check('R1 todas arrancan boca abajo',
  [...document.querySelectorAll('#hand .card')].every((c) => c.dataset.face === 'down'));

// ---- LA REGLA 2: nombrar da vuelta AHI MISMO, en su lugar
const before = [...document.querySelectorAll('#hand .hand__slot')].indexOf(
  document.querySelector('[data-card-id="c"]').closest('.hand__slot'));
const r = hand.reveal('c');
const after = [...document.querySelectorAll('#hand .hand__slot')].indexOf(
  document.querySelector('[data-card-id="c"]').closest('.hand__slot'));
check('R2 acertar la da vuelta', r.hit && document.querySelector('[data-card-id="c"]').dataset.face === 'up');
check('R2 queda marcada como acierto', document.querySelector('[data-card-id="c"]').dataset.result === 'hit');
check('R2 NO cambia de lugar en el abanico', before === after, `${before} -> ${after}`);

// ---- LA REGLA 4: falso positivo entra igual, tachado
const intruso = card('zz', 'Carta Ajena');
hand.addFalsePositive(intruso);
const fp = document.querySelector('[data-card-id="zz"]');
check('R4 el falso positivo entra al abanico', !!fp);
check('R4 va dado vuelta y marcado', fp.dataset.face === 'up' && fp.dataset.result === 'false-positive');
const fpStyle = getComputedStyle(fp.querySelector('.card__face--front'));
check('R4 lleva borde rojo', fpStyle.borderTopColor === 'rgb(192, 69, 60)', fpStyle.borderTopColor);
check('R4 el nombre va tachado',
  getComputedStyle(fp.querySelector('.card__name')).textDecorationLine.includes('line-through'));

// ---- MODO PICKS (niveles 1 y 2): marcar da vuelta, desmarcar vuelve a tapar.
// Si marcar un pick no da vuelta la carta, el cierre gris se come todo y el
// puntaje da 0/N. Ese fue el bug: los picks solo escribian en una variable.
const picksBox = document.createElement('div');
picksBox.className = 'table';
picksBox.style.cssText = 'position:absolute; left:-9999px; width:420px;';
const picksHandEl = document.createElement('div');
picksHandEl.className = 'hand';
picksBox.appendChild(picksHandEl);
document.body.appendChild(picksBox);

const manoPicks = [card('p1', 'Artillera'), card('p2', 'Chispa'), card('p3', 'Descarga'), card('p3', 'Descarga')];
const hp = new Hand(picksHandEl, manoPicks);
const enPicks = (id) => picksHandEl.querySelector(`[data-card-id="${id}"]`);

const marcada = hp.reveal('p1');
check('P1 marcar un pick da vuelta la carta', marcada.hit && enPicks('p1').dataset.face === 'up');
check('P1 y queda en color, marcada como acierto', enPicks('p1').dataset.result === 'hit');

const destapada = hp.unreveal('p1');
check('P2 desmarcar la vuelve a tapar', destapada && enPicks('p1').dataset.face === 'down');
check('P2 y le saca la marca de acierto', !enPicks('p1').dataset.result);
check('P2 el slot NO desaparece del abanico',
  picksHandEl.querySelectorAll('.hand__slot').length === manoPicks.length);

hp.reveal('p3');
hp.reveal('p3');
check('P3 las dos copias se dan vuelta por separado', hp.remaining('p3') === 0);
hp.unreveal('p3');
check('P3 destapar una deja la otra dada vuelta', hp.remaining('p3') === 1);

const intrusa = card('zz2', 'Ajena Dos');
hp.addFalsePositive(intrusa);
check('P4 el falso positivo entra a la fila', !!enPicks('zz2'));
const quitado = hp.removeFalsePositive('zz2');
check('P4 desmarcarlo lo saca de la fila', quitado && !enPicks('zz2'));
check('P4 y no queda en el resumen', hp.summary().falsePositives.length === 0);

hp.reveal('p2');
hp.revealRest({ stagger: 0 });
check('P5 tras el cierre lo marcado sigue en color', enPicks('p2').dataset.result === 'hit');
check('P5 y lo que no marque queda gris', enPicks('p1').dataset.result === 'missed');
picksBox.remove();

// ---- LA REGLA 3: el cierre. Las que no vi, en blanco y negro, MISMA fila.
const filaAntes = document.querySelectorAll('#hand .hand__slot').length;
const missed = hand.revealRest({ stagger: 0 });
check('R3 el cierre da vuelta las que faltaban', missed.length === mano.length - 1, `${missed.length}`);
check('R3 NO se agregan huecos nuevos al cerrar',
  document.querySelectorAll('#hand .hand__slot').length === filaAntes, `${filaAntes}`);

const unaMissed = document.querySelector('[data-card-id="a"]');
check('R3 quedan marcadas como missed', unaMissed.dataset.result === 'missed');
const missedStyle = getComputedStyle(unaMissed.querySelector('.card__face--front'));
check('R3 GRIS DE VERDAD: grayscale(1)', missedStyle.filter.includes('grayscale(1)'), missedStyle.filter);
check('R3 y opacidad baja', parseFloat(missedStyle.opacity) < 0.5, missedStyle.opacity);

// La acertada sigue en COLOR: el contraste es el feedback
const hitStyle = getComputedStyle(document.querySelector('[data-card-id="c"] .card__face--front'));
check('R3 la acertada NO se grisea',
  !hitStyle.filter.includes('grayscale(1)') && parseFloat(hitStyle.opacity) === 1, hitStyle.filter);

// Todas en la misma fila: mismo offsetTop
const tops = new Set([...document.querySelectorAll('#hand .hand__slot')].map((s) => Math.round(s.getBoundingClientRect().top)));
check('R3 acertadas y grises en la MISMA fila', tops.size <= 2, `${tops.size} alturas distintas`);

// ---- La proporcion real de la carta
const cardBox = document.querySelector('#hand .card').getBoundingClientRect();
const ratio = cardBox.width / cardBox.height;
check('Carta en proporcion 63:88', Math.abs(ratio - 63 / 88) < 0.02, ratio.toFixed(3));

// ---- El dorso es el dorso real de la carta, no un dibujo
const dorso = getComputedStyle(document.querySelector('#hand .card__face--back'));
check('Dorso: usa la imagen real', dorso.backgroundImage.includes('assets/card-back.png'),
  dorso.backgroundImage.slice(0, 60));
check('Dorso: sin el circulo dibujado', !document.querySelector('#hand .card__back-mark'));

// ---- Sin arte, la carta sigue siendo legible: nunca un hueco
const sinArte = renderCard(card('x', 'Sin Arte'), { faceUp: true });
document.body.appendChild(sinArte);
check('Sin img, la ventana de arte se dibuja igual',
  sinArte.querySelector('.card__art').classList.contains('card__art--empty'));
check('Sin img, el nombre sigue visible', sinArte.querySelector('.card__name').textContent === 'Sin Arte');
sinArte.remove();

// ---- Con arte, la carta ES la imagen: sin marco blanco, sin pips, sin texto dibujado
const PNG = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
const conArte = renderCard({ ...card('y', 'Con Arte'), img: PNG }, { faceUp: true });
document.body.appendChild(conArte);
const oculto = (sel) => {
  const n = conArte.querySelector(sel);
  return !n || getComputedStyle(n).display === 'none';
};
check('Con img, no se dibuja el cuerpo blanco', oculto('.card__body'));
check('Con img, no se dibujan los pips de coste', oculto('.card__costs'));
check('Con img, no se dibuja la banda de dominio', oculto('.card__band'));
const faceBox = conArte.querySelector('.card__face--front').getBoundingClientRect();
const artBox = conArte.querySelector('.card__art').getBoundingClientRect();
check('Con img, el arte ocupa toda la carta',
  Math.abs(artBox.height - faceBox.height) <= 2, `${artBox.height.toFixed(1)} / ${faceBox.height.toFixed(1)}`);
conArte.remove();

// ---- Las runas en mesa son CARTAS de runa, no circulos con una letra
const runaAbierta = renderRune({ domain: 'fury', ready: true });
const runaAgotada = renderRune({ domain: 'order', ready: false });
document.body.append(runaAbierta, runaAgotada);
const imgRuna = runaAbierta.querySelector('img');
check('Runa: se dibuja con la imagen oficial de su dominio', !!imgRuna && /f95ed6ba/.test(imgRuna.src));
check('Runa: sin letra suelta como texto', runaAbierta.textContent.trim().length > 1,
  runaAbierta.textContent);
const rAbierta = runaAbierta.querySelector('.rune__card').getBoundingClientRect();
check('Runa abierta: parada, en proporcion de carta', rAbierta.height > rAbierta.width,
  `${rAbierta.width.toFixed(1)}x${rAbierta.height.toFixed(1)}`);
check('Runa agotada: tumbada como en la mesa',
  /matrix\(0, 1, -1, 0|matrix\(6\.1/.test(getComputedStyle(runaAgotada.querySelector('.rune__card')).transform),
  getComputedStyle(runaAgotada.querySelector('.rune__card')).transform);
check('Runa: el lector de pantalla sabe dominio y estado',
  runaAgotada.getAttribute('aria-label') === 'Order agotada');
check('Runa: se lee su dominio debajo', runaAbierta.querySelector('.rune__label')?.textContent === 'Fury');
check('Runa agotada: lo dice en palabras', runaAgotada.querySelector('.rune__label')?.textContent === 'Order · agotada');
check('Runa: grande, al menos 48px de ancho', rAbierta.width >= 48, rAbierta.width.toFixed(1));
runaAbierta.remove(); runaAgotada.remove();

// ---- La leyenda del rival, boca arriba a la IZQUIERDA de las runas: dice que mazo es
const PNG_L = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
const legendEl = document.getElementById('legend');
legendEl.appendChild(renderCard({ id: 'ley', name: 'Leyenda', type: 'legend', domain: 'chaos', img: PNG_L },
  { faceUp: true }));
for (let i = 0; i < 7; i++) {
  document.getElementById('runes').appendChild(renderRune({ domain: i % 2 ? 'chaos' : 'order', ready: true }));
}
const legBox = legendEl.querySelector('.card').getBoundingClientRect();
const runasBox = document.getElementById('runes').getBoundingClientRect();
check('Leyenda: boca arriba', legendEl.querySelector('.card').dataset.face === 'up');
check('Leyenda: a la izquierda de las runas', legBox.right <= runasBox.left + 1,
  `${legBox.right.toFixed(0)} vs ${runasBox.left.toFixed(0)}`);
check('Leyenda: en la misma fila que las runas', legBox.top < runasBox.bottom && runasBox.top < legBox.bottom);
check('Leyenda: mas grande que una runa', legBox.width >= 64, legBox.width.toFixed(1));

// El campeon elegido tambien esta boca arriba en la mesa: debajo de la leyenda, misma columna
legendEl.appendChild(renderCard({ id: 'camp', name: 'Campeon', type: 'unit', domain: 'chaos', img: PNG_L },
  { faceUp: true }));
const [cLey, cCamp] = [...legendEl.querySelectorAll('.card')].map((c) => c.getBoundingClientRect());
check('Campeon: debajo de la leyenda, separado', cCamp.top >= cLey.bottom + 6,
  `${cCamp.top.toFixed(0)} vs ${cLey.bottom.toFixed(0)}`);
check('Campeon: en la misma columna', Math.abs(cCamp.left - cLey.left) <= 1);

// En pantalla ancha sobra margen: la leyenda sale del panel negro, a su izquierda.
// (Container query: se prueba con un contenedor de ancho fijo, no con la ventana.)
const ancha = document.createElement('div');
ancha.style.cssText = 'container-type: inline-size; width: 1200px; position: absolute; left: -99999px; top: 0;';
ancha.innerHTML = '<div class="app"><section class="table"><div class="board">' +
  '<div class="legend"></div><div class="runes"></div></div></section></div>';
document.body.appendChild(ancha);
ancha.querySelector('.legend').appendChild(renderCard(
  { id: 'ley2', name: 'Leyenda', type: 'legend', domain: 'chaos', img: PNG_L }, { faceUp: true }));
const legAncha = ancha.querySelector('.legend .card').getBoundingClientRect();
const mesaAncha = ancha.querySelector('.table').getBoundingClientRect();
check('Leyenda ancha: FUERA del panel, a la izquierda', legAncha.right <= mesaAncha.left - 8,
  `${legAncha.right.toFixed(0)} vs ${mesaAncha.left.toFixed(0)}`);
check('Leyenda ancha: alineada arriba con el panel', Math.abs(legAncha.top - mesaAncha.top) <= 2,
  `${legAncha.top.toFixed(0)} vs ${mesaAncha.top.toFixed(0)}`);
ancha.remove();

// ---- QUIEN DESBORDA A LO ANCHO (esto es lo que el screenshot mostro)
const docW = document.documentElement.clientWidth;

// Un hijo dentro de un contenedor con overflow:auto sigue reportando su posicion
// REAL en getBoundingClientRect aunque este clipeado. Contarlo como desborde seria
// un falso positivo: lo que importa es que el contenedor scrollee, no la pagina.
const dentroDeScroller = (node) => {
  for (let p = node.parentElement; p && p !== document.body; p = p.parentElement) {
    const ov = getComputedStyle(p).overflowX;
    if (ov === 'auto' || ov === 'scroll' || ov === 'hidden' || ov === 'clip') return true;
  }
  return false;
};

const culpables = [];
for (const node of document.querySelectorAll('#stage *')) {
  if (dentroDeScroller(node)) continue;
  const r = node.getBoundingClientRect();
  if (r.right > docW + 1 || r.left < -1) {
    culpables.push(`${node.tagName}.${node.className || '(sin clase)'} [${Math.round(r.left)}..${Math.round(r.right)}]`);
  }
}
check(`Nada desborda de ${docW}px`, culpables.length === 0, culpables.slice(0, 6).join(' | '));

// El que manda: la PAGINA no puede scrollear en horizontal, pase lo que pase.
const docSW = document.documentElement.scrollWidth;
let quien = '';
if (docSW > docW + 1) {
  for (const node of document.querySelectorAll('body *')) {
    const r = node.getBoundingClientRect();
    if (r.right > docW + 1) { quien = `${node.tagName}.${node.className} hasta ${Math.round(r.right)}`; break; }
  }
}
check('El documento no scrollea en horizontal', docSW <= docW + 1,
  `scrollWidth ${docSW} vs ${docW} — primero: ${quien || 'nadie'}`);

// Abierta tampoco scrollea: las cartas se achican hasta entrar. Sin barra.
const manoAbierta = document.getElementById('hand');
check('La mano abierta no tiene scroll horizontal',
  manoAbierta.scrollWidth <= manoAbierta.clientWidth + 1,
  `hand ${manoAbierta.scrollWidth} / ${manoAbierta.clientWidth}`);

// ---- ANCHO DE TELEFONO REAL.
// Chrome headless tiene un piso de viewport (~500px), asi que un --window-size
// chico NO prueba nada. Montamos la mano en un contenedor de ancho FIJO y
// medimos contra el: eso si reproduce un telefono angosto.
for (const ancho of [320, 360, 390]) {
  const box = document.createElement('div');
  box.style.cssText = `width:${ancho}px; padding:0 12px; box-sizing:border-box; position:absolute; left:-9999px;`;
  const table = document.createElement('div');
  table.className = 'table';
  const h = document.createElement('div');
  h.className = 'hand';
  table.appendChild(h);
  box.appendChild(table);
  document.body.appendChild(box);

  // Caso peor: mano de 7 + tres falsos positivos = 10 cartas en la fila.
  const peor = new Hand(h, mano);
  peor.addFalsePositive(card('fp1', 'Intrusa Uno'));
  peor.addFalsePositive(card('fp2', 'Intrusa Dos'));
  peor.addFalsePositive(card('fp3', 'Intrusa Tres'));

  const limite = box.getBoundingClientRect().right;
  const desbordan = [...h.querySelectorAll('.hand__slot')]
    .filter((s) => s.getBoundingClientRect().right > limite + 1).length;

  check(`Mano de 10 cartas entra en ${ancho}px`, desbordan === 0, `${desbordan} slots se salen`);
  check(`Sin scroll horizontal en ${ancho}px`,
    h.scrollWidth <= h.clientWidth + 1, `${h.scrollWidth} vs ${h.clientWidth}`);

  // Y al cerrar, tampoco: la fila abierta entra entera.
  peor.revealRest({ stagger: 0 });
  check(`Cerrada, sin scroll horizontal en ${ancho}px`,
    h.scrollWidth <= h.clientWidth + 1, `${h.scrollWidth} vs ${h.clientWidth}`);

  // La ronda siguiente monta otra mano en el MISMO contenedor: arranca cerrada.
  new Hand(h, mano);
  check(`Mano nueva arranca sin abrir en ${ancho}px`, !h.classList.contains('hand--open'));
  box.remove();
}

// ---- MURO DEL MAZO (AC-ARC-31, AC-ARC-59): una celda por carta distinta, todas boca abajo.
const { mountDeckWall } = await import('../src/ui/deck-wall.js');
const wallHost = document.createElement('div');
document.querySelector('#stage main').appendChild(wallHost);
const wallCards = [
  { ...card('w1', 'Chispa', 1, {}, 'order'), img: PNG },
  { ...card('w2', 'Descarga', 2, { chaos: 1 }, 'chaos'), img: PNG },
  { ...card('w3', 'Granada', 3, { order: 2 }, 'order'), img: null },
  { ...card('w4', 'Motin', 9, {}, 'chaos'), img: PNG },
];
const wall = mountDeckWall(wallHost, { cards: wallCards });
const wslot = (id) => wallHost.querySelector(`.wall__slot[data-card-id="${id}"]`);
const wstates = () => wallCards.map((c) => wslot(c.id)?.dataset.state).join(',');
check('AC-ARC-31: el muro tiene una celda por carta distinta, con ids unicos y todas boca abajo',
  wallHost.querySelectorAll('.wall__slot').length === 4 &&
  new Set([...wallHost.querySelectorAll('.wall__slot')].map((s) => s.dataset.cardId)).size === 4 &&
  wstates() === 'down,down,down,down' &&
  [...wallHost.querySelectorAll('.wall__slot > .card')].every((c) => c.dataset.face === 'down'));
check('AC-ARC-31: el dorso es el real, sin texto "desconocido", sin contadores ni tabindex',
  /card-back\.png/.test(getComputedStyle(wslot('w1').querySelector('.card__face--back')).backgroundImage) &&
  !/desconocid/i.test(wallHost.textContent) && !wallHost.querySelector('[tabindex]') &&
  wslot('w1').querySelector('.card').getAttribute('aria-label') === 'Carta boca abajo');
wall.reveal('w2', { fresh: true });
check('AC-ARC-31: reveal da vuelta SOLO esa celda, en su lugar, con el brillo de su dominio',
  wstates() === 'down,found,down,down' && wslot('w2').querySelector('.card').dataset.face === 'up' &&
  wslot('w2').dataset.glow === 'chaos' && wslot('w2').hasAttribute('data-fresh') &&
  wslot('w2').style.getPropertyValue('--glow') === '#7a4fa3' &&
  getComputedStyle(wslot('w2').querySelector('.card')).boxShadow !== 'none' &&
  !wslot('w1').hasAttribute('data-fresh') && !wslot('w1').hasAttribute('data-glow'));
check('AC-ARC-59: la carta revelada es la imagen oficial (renderCard), no un placeholder de texto',
  wslot('w2').querySelector('.card__face--image img')?.getAttribute('src') === PNG);
wall.reveal('w1', { fresh: true });
check('AC-ARC-31: el brillo vive sólo en la ultima revelada; la anterior sigue levantada sin brillo',
  wstates() === 'found,found,down,down' && wslot('w1').dataset.glow === 'order' &&
  wallHost.querySelectorAll('[data-fresh]').length === 1 && !wslot('w2').hasAttribute('data-glow'));
wall.setFound(['w3']);
check('AC-ARC-31: setFound deja levantadas sólo esas, sin brillo, y tapa el resto',
  wstates() === 'down,down,found,down' && wallHost.querySelectorAll('[data-fresh],[data-glow]').length === 0 &&
  wslot('w1').querySelector('.card').dataset.face === 'down');
wall.showOutcomes([
  { cardId: 'w1', outcome: 'hit', reason: null },
  { cardId: 'w2', outcome: 'missed', reason: 'Se podía pagar: 2 + 1 Chaos' },
  { cardId: 'w3', outcome: 'false-positive', reason: 'Pide 2 Order y no hay runas Order disponibles' },
  { cardId: 'w4', outcome: 'irrelevant', reason: null },
]);
check('AC-ARC-31: showOutcomes marca los cuatro estados; irrelevante queda boca abajo',
  wstates() === 'found,missed,false-positive,irrelevant' &&
  ['w1', 'w2', 'w3'].every((id) => wslot(id).querySelector('.card').dataset.face === 'up') &&
  wslot('w4').querySelector('.card').dataset.face === 'down' &&
  wslot('w1').dataset.glow === 'order' && !wslot('w1').hasAttribute('data-fresh'));
check('AC-ARC-31: sólo missed y falso positivo explican; son focusables y llevan el motivo en el aria-label',
  wslot('w2').tabIndex === 0 && wslot('w3').tabIndex === 0 &&
  wslot('w2').getAttribute('aria-label').includes('Se podía pagar: 2 + 1 Chaos') &&
  wslot('w3').getAttribute('aria-label').includes('no hay runas Order') &&
  !wslot('w1').hasAttribute('tabindex') && !wslot('w4').hasAttribute('tabindex') &&
  !wslot('w4').hasAttribute('data-reason') && wslot('w3').querySelector('.wall__tag')?.textContent === 'NO ENTRABA');
const why = wallHost.querySelector('.wall__why');
check('AC-ARC-31: el motivo vive en una region role=status siempre presente y vacía (así el lector la anuncia al llenarse)',
  why?.getAttribute('role') === 'status' && why.hidden === false && why.textContent === '');
wslot('w2').dispatchEvent(new Event('focusin', { bubbles: true }));
const whyFocus = why.textContent === 'Se podía pagar: 2 + 1 Chaos';
wslot('w3').dispatchEvent(new Event('pointerenter'));
const whyHover = why.textContent.includes('no hay runas Order');
wslot('w2').click();
check('AC-ARC-31: focusin, pointerenter y click muestran el motivo de esa celda',
  whyFocus && whyHover && why.textContent === 'Se podía pagar: 2 + 1 Chaos');

burst.destroy(); staleToastCallback?.();
check('AC-CMB-45: desmontaje borra fan/aviso y callbacks viejos no resucitan UI', burstMount.children.length === 0);
burstMount.remove();

const pairMount = document.createElement('div');
document.querySelector('#stage main').appendChild(pairMount);
const pairCards = [
  { id: 'a-pair', name: 'Carta A', energy: 1, power: {}, type: 'unit' },
  { id: 'b-pair', name: 'Carta B', energy: 1, power: {}, type: 'unit' },
];
const pairDeck = { id: 'pair', name: 'Par', cards: [{ cardId: 'a-pair', qty: 2 }, { cardId: 'b-pair', qty: 1 }], runes: { order: 12 } };
const pairFlow = mountRecall(pairMount, { deck: pairDeck, cards: pairCards, seed: 17,
  initialLevel: 3,
  storage: { loadRecallSnapshot: () => ({ ok: false }), saveRecallSnapshot: () => ({ ok: true, persisted: true }) },
  scheduler: () => Promise.resolve(), feedbackOptions: { ...feedbackOptions, reducedMotion: () => true } });
await pairFlow.ready;
const pairInput = pairMount.querySelector('input[role="combobox"]');
for (const query of ['Carta A', 'Carta A', 'Carta B']) {
  pairInput.value = query;
  pairInput.dispatchEvent(new Event('input', { bubbles: true }));
  pairMount.querySelector('[role="option"]')?.click();
}
pairMount.querySelector('.recall-composer__preview + button')?.click();
check('AC-CMB-47: grupo multicarta da vuelta A×2 y B×1 sin multiplicador agregado',
  pairMount.querySelectorAll('.recall-feedback__fan .card[data-card-id="a-pair"][data-face="up"]').length === 2 &&
  pairMount.querySelectorAll('.recall-feedback__fan .card[data-card-id="b-pair"][data-face="up"]').length === 1 &&
  !pairMount.querySelector('.recall-feedback__badge') &&
  pairMount.querySelectorAll('.recall__results .recall-results__group .card').length === 2);
pairFlow.destroy(); pairMount.remove();

const calmMount = document.createElement('div');
document.querySelector('#stage main').appendChild(calmMount);
const calmOptions = { ...feedbackOptions, reducedMotion: () => true };
const calm = mountRecall(calmMount, { deck: terminalDeck, cards: [terminalCard], seed: 17,
  storage: { loadRecallSnapshot: () => ({ ok: false }), saveRecallSnapshot: () => ({ ok: true, persisted: true }) },
  scheduler: () => Promise.resolve(), feedbackOptions: calmOptions });
await calm.ready;
const calmInput = calmMount.querySelector('input[role="combobox"]');
calmInput.value = 'costo uno'; calmInput.dispatchEvent(new Event('input', { bubbles: true }));
calmMount.querySelector('[role="option"]')?.click();
calmMount.querySelector('.recall-composer__preview + button')?.click();
const calmCard = calmMount.querySelector('.recall-feedback__fan .card[data-face="up"]');
check('AC-CMB-45: reduced motion deja frente y Correcto sin giro ni robar foco',
  !!calmCard && getComputedStyle(calmCard).transform === 'none' &&
  calmMount.querySelector('.recall-feedback__toast:not([hidden])')?.textContent === '¡Correcto!' &&
  document.activeElement === calmInput);
calm.destroy(); calmMount.remove();

// Cobertura visual de las doce fronteras: el nivel es abiertas, no mesa total.
for (let level = 1; level <= 12; level++) {
  const boardMount = document.createElement('div');
  document.querySelector('#stage main').appendChild(boardMount);
  const boardFlow = mountRecall(boardMount, { deck: terminalDeck, cards: [terminalCard], seed: 17,
    initialLevel: level, storage: { loadRecallSnapshot: () => ({ ok: false }) },
    scheduler: () => Promise.resolve() });
  await boardFlow.ready;
  const open = boardMount.querySelectorAll('.rune:not(.rune--spent)').length;
  const exhausted = boardMount.querySelectorAll('.rune--spent').length;
  const remaining = 12 - open - exhausted;
  check(`AC-CMB-19/31/33: nivel ${level} muestra ${level} abiertas y suma 12`,
    open === level && remaining >= 0 &&
    boardMount.textContent.includes(`${remaining} en el Mazo de Runas`) &&
    (level !== 12 || exhausted === 0));
  boardFlow.destroy(); boardMount.remove();
}

const warningMount = document.createElement('div');
document.querySelector('#stage main').appendChild(warningMount);
const warningFlow = mountRecall(warningMount, { deck: terminalDeck, cards: [terminalCard], seed: 17,
  storage: { loadRecallSnapshot: () => ({ ok: false }),
    saveRecallSnapshot: () => ({ ok: true, persisted: false, warning: 'Sólo en memoria: no se garantiza continuidad' }) },
  scheduler: () => Promise.resolve() });
await warningFlow.ready;
const warningInput = warningMount.querySelector('input[role="combobox"]');
warningInput.value = 'costo uno'; warningInput.dispatchEvent(new Event('input', { bubbles: true }));
warningMount.querySelector('[role="option"]')?.click();
warningMount.querySelector('.recall-composer__preview + button')?.click();
check('AC-CMB-22: almacenamiento bloqueado muestra aviso honesto y conserva acierto en memoria',
  warningMount.textContent.includes('Sólo en memoria') &&
  warningMount.querySelectorAll('.recall-results__group').length === 1);
warningFlow.destroy(); warningMount.remove();

const changedMount = document.createElement('div');
document.querySelector('#stage main').appendChild(changedMount);
const changedDeck = { ...flowDeck, cards: [{ cardId: 'alpha', qty: 2 }, { cardId: 'beta', qty: 1 }] };
const changedFlow = mountRecall(changedMount, { deck: changedDeck, cards: sampleCards, seed: 9,
  storage: actualStore, scheduler: () => Promise.resolve() });
await changedFlow.ready;
check('AC-CMB-28/29: deck incompatible no aplica grupos persistidos de otra identidad',
  changedMount.textContent.includes('Nivel 1') &&
  changedMount.querySelectorAll('.recall-results__group').length === 0);
changedFlow.destroy(); changedMount.remove();

const staleMount = document.createElement('div');
document.querySelector('#stage main').appendChild(staleMount);
let releaseCount;
const staleCards = Array.from({ length: 1100 }, (_, i) =>
  ({ id: `stale-${i}`, name: `Carta ${i}`, energy: 1, power: {}, type: 'unit' }));
const staleDeck = { ...terminalDeck, cards: staleCards.map((card) => ({ cardId: card.id, qty: 1 })) };
const staleFlow = mountRecall(staleMount, { deck: staleDeck, cards: staleCards, seed: 17,
  storage: { loadRecallSnapshot: () => ({ ok: false }) },
  scheduler: () => new Promise((resolve) => { releaseCount = resolve; }) });
check('AC-CMB-26: conteo cooperativo cede al navegador con controles pendientes',
  typeof releaseCount === 'function' &&
  staleMount.querySelector('[data-action="skip"]')?.hidden === true &&
  !staleMount.querySelector('input[role="combobox"]'));
staleFlow.destroy();
releaseCount?.();
await staleFlow.ready;
check('AC-CMB-26: desmontar durante conteo descarta resultado viejo sin pintar acierto',
  staleMount.children.length === 0);
staleMount.remove();

const invalidMount = document.createElement('div');
document.querySelector('#stage main').appendChild(invalidMount);
const invalidFlow = mountRecall(invalidMount, { deck: { ...flowDeck, cards: [{ cardId: 'missing', qty: 1 }] },
  cards: sampleCards, seed: 42, storage: memoryStore });
await invalidFlow.ready;
check('AC-CMB-13/26: dato desconocido bloquea acciones, no se anuncia vacío comprobado',
  invalidMount.textContent.includes('desconocido') &&
  invalidMount.querySelector('[data-action="skip"]')?.hidden === true &&
  invalidMount.querySelector('[data-action="next"]')?.hidden === true &&
  !invalidMount.textContent.includes('No hay jugadas posibles'));
invalidFlow.destroy(); invalidMount.remove();

// U10: app real desde su propio index y data/cards.json, no sólo componentes de test.
const liveFrame = document.createElement('iframe');
liveFrame.title = 'App real en ancho de teléfono';
liveFrame.style.cssText = 'width:320px;height:740px;border:0;display:block;max-width:100%';
liveFrame.src = '../index.html';
document.querySelector('#stage main').appendChild(liveFrame);
await new Promise((resolve) => { liveFrame.onload = resolve; });
await liveFrame.contentWindow.__riftrainReady;
const liveDoc = liveFrame.contentDocument;
check('AC-CMB-01/19: index arranca en recall nivel1, no en cuestionario legacy',
  !!liveDoc.querySelector('#recall-root input[role="combobox"]') &&
  liveDoc.querySelector('#recall-root').textContent.includes('Nivel 1') &&
  getComputedStyle(liveDoc.querySelector('#legacy-mode')).display === 'none');
check('AC-CMB-43: app real a 320px mantiene fan de siete dorsos y lista sin scroll horizontal',
  liveDoc.querySelectorAll('#recall-root .recall-feedback__slot').length === 7 &&
  liveDoc.querySelectorAll('#recall-root .recall-feedback__fan .card[data-face="down"]').length === 7 &&
  !!liveDoc.querySelector('#recall-root .recall__results') &&
  liveDoc.documentElement.scrollWidth <= liveDoc.documentElement.clientWidth + 1);
check('AC-CMB-14: app real usa todo el mazo main y muestra carta Gust con imagen', (() => {
  const input = liveDoc.querySelector('#recall-root input[role="combobox"]');
  if (!input) return false;
  input.value = 'gust'; input.dispatchEvent(new Event('input', { bubbles: true }));
  const option = liveDoc.querySelector('#recall-root [role="option"]');
  return !!option?.textContent.includes('Gust') && !!option.querySelector('img');
})());
liveDoc.querySelector('#recall-root [role="option"]')?.click();
liveDoc.querySelector('#recall-root .recall-composer__preview + button')?.click();
check('AC-CMB-16/27: app real revela Gust y sigue en nivel1',
  liveDoc.querySelectorAll('#recall-root .recall-results__group').length >= 1 &&
  liveDoc.querySelector('#recall-root').textContent.includes('Nivel 1'));
check('AC-CMB-44: app real conserva Gust en lista y avisa Correcto al voltear ilustración',
  liveDoc.querySelectorAll('#recall-root .recall__results .recall-results__group').length >= 1 &&
  liveDoc.querySelector('#recall-root .recall-feedback__toast:not([hidden])')?.textContent === '¡Correcto!');
liveDoc.querySelector('#btn-mode')?.click();
check('AC-CMB-01: modo cartas legacy sigue disponible y recall se desmonta',
  getComputedStyle(liveDoc.querySelector('#legacy-mode')).display !== 'none' &&
  getComputedStyle(liveDoc.querySelector('#recall-root')).display === 'none' &&
  !!liveDoc.querySelector('#hand .card'));
const legacyBefore = actualStore.load({}).answered ?? 0;
liveDoc.querySelector('#btn-primary')?.click();
check('AC-CMB-27: cerrar ronda legacy preserva snapshot recall y actualiza progreso legacy',
  (actualStore.load({}).answered ?? 0) === legacyBefore + 1 &&
  actualStore.load({}).recall?.found?.length >= 1);
liveDoc.querySelector('#btn-mode')?.click();
check('AC-CMB-01: modo runas legacy sigue disponible',
  getComputedStyle(liveDoc.querySelector('#input-num')).display !== 'none');
liveDoc.querySelector('#btn-mode')?.click();
await liveFrame.contentWindow.__riftrainReady;
check('AC-CMB-27: volver a recall restaura Gust, sin reiniciar progreso',
  liveDoc.querySelectorAll('#recall-root .recall-results__group').length >= 1 &&
  getComputedStyle(liveDoc.querySelector('#legacy-mode')).display === 'none');
check('AC-CMB-45: volver de legacy restaura lista pero no repite fan ni Correcto',
  liveDoc.querySelectorAll('#recall-root .recall-feedback__fan .card[data-face="down"]').length === 7 &&
  !liveDoc.querySelector('#recall-root .recall-feedback__toast:not([hidden])'));
check('AC-CMB-21: app completa no desborda documento a 320px',
  liveDoc.documentElement.scrollWidth <= liveDoc.documentElement.clientWidth + 1,
  `${liveDoc.documentElement.scrollWidth} / ${liveDoc.documentElement.clientWidth}`);
// Fixture legal con ocho copias de cartas REALES positivas: abanico sin cap a 320.
liveDoc.querySelector('#btn-mode')?.click(); // desmontar el controlador real antes de usar el host del test
liveDoc.querySelector('#legacy-mode').classList.add('hidden');
const nineHost = liveDoc.querySelector('#recall-root');
nineHost.classList.remove('hidden');
const nineIds = ['lightning-rush', 'gust', 'traveling-merchant', 'shadow-order-disciple'];
const nineCards = nineIds.map((id) => realData.cards.find((c) => c.id === id));
const nineQty = [3, 1, 3, 1];
const nineDeck = { id: 'eight-test', name: 'Fixture legal', cards: nineIds.map((cardId, i) => ({ cardId, qty: nineQty[i] })),
  runes: { chaos: 9, order: 3 } };
const nineFlow = mountRecall(nineHost, { deck: nineDeck, cards: nineCards, seed: 3, initialLevel: 12,
  storage: { loadRecallSnapshot: () => ({ ok: false }), saveRecallSnapshot: () => ({ ok: true, persisted: true }) },
  scheduler: () => Promise.resolve(), feedbackOptions: { ...feedbackOptions, reducedMotion: () => true } });
await nineFlow.ready;
for (const card of nineCards) {
  const input = nineHost.querySelector('input[role="combobox"]');
  input.value = card.name; input.dispatchEvent(new Event('input', { bubbles: true }));
  [...nineHost.querySelectorAll('[role="option"]')].find((option) =>
    option.querySelector('.recall-composer__name')?.textContent === card.name)?.click();
  const qty = nineQty[nineCards.indexOf(card)];
  for (let copy = 1; copy < qty; copy++) nineHost.querySelector(`.recall-composer__choice [data-action="inc"]:not([disabled])`)?.click();
}
nineHost.querySelector('.recall-composer__preview + button')?.click();
check('AC-CMB-47/48/53: 8 copias pagables positivas reales dan 8 caras 3+1+3+1 a 320 sin cap',
  nineIds.every((id, i) => nineHost.querySelectorAll(`.recall-feedback__fan .card[data-card-id="${id}"][data-face="up"]`).length === nineQty[i]) &&
  nineHost.querySelectorAll('.recall-feedback__slot').length === 8 &&
  nineHost.querySelectorAll('.recall__results .recall-results__group .card').length === 4 &&
  liveDoc.documentElement.scrollWidth <= liveDoc.documentElement.clientWidth + 1);
nineFlow.destroy();
liveFrame.remove();

const head = document.createElement('div');
head.textContent = `\n=== ${pass} PASS / ${fail} FAIL ===`;
head.className = fail ? 't-fail' : 't-pass';
out.appendChild(head);
document.title = fail ? `FAIL(${fail})` : `PASS(${pass})`;
</script>
</body>
